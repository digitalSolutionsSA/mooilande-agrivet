<!doctype html>
<html lang="en">

    <link rel="preconnect" href="https://ebovailsvazjlfutmgmu.supabase.co" crossorigin />

      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&family=DM+Sans:opsz,wght@9..40,400..700&display=swap"

    />

      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&family=DM+Sans:opsz,wght@9..40,400..700&display=swap"
